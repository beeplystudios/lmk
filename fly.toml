# fly.toml app configuration file generated for lmk-server on 2025-11-08T23:41:36-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'lmk-server'
primary_region = 'iad'

[build]
  dockerfile = './Dockerfile'

[http_service]
  internal_port = 3000
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 5000
    soft_limit = 1000

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 2
